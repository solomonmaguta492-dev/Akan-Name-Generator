<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKAN-NAME-GENERATOR</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!---Header Section-->
    <header>
      <h1>Akan Name Generator</h1>
       <h4> 
        Discover your Ghanaian name. <br />
        In Akan culture, children are named after the day <br />
        of the week they were born. Enter your <br />
        birthdate and gender to find yours.
      </h4>
    
    </header>
    <!--Form Section-->
    <form id="Akan Form">
        <div class="Form Group">
            <label for="Birth Date">Birth Date</label>
            <input type="date" id="Birth Date" required>
        </div>

        <div class="Form-Group">
            <label for="Gender">Gender</label>
            <select id="Gender" required>
                <option value="" disabled selected>Select your Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <button type="submit">Generate Name</button>

     </form>
     <!--Section part-->
     <section class="result-section" id="resultselection">
        <h3>Your Akan Name Is:</h3>
        <div class="Name-Display" id="NameDisply"></div>
     </section>
     </div>
  </body>
</html>
